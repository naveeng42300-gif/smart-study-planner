
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart Study Planner</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<!-- LOGIN AND REGISTRATION -->
<div id="authSection" class="container py-5" style="max-width:450px;">
    <div class="card p-4">
        <h2 class="text-center mb-3">📚 Smart Study Planner</h2>
        <p class="text-center text-secondary">Plan smarter. Learn better.</p>

        <div class="d-flex gap-2 mb-3">
            <button id="showLogin" class="btn btn-primary w-50">Login</button>
            <button id="showRegister" class="btn btn-outline-primary w-50">Register</button>
        </div>

        <form id="loginForm">
            <label class="form-label">Username</label>
            <input id="loginUsername" class="form-control mb-3" required>

            <label class="form-label">Password</label>
            <input id="loginPassword" type="password" class="form-control mb-3" required>

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <form id="registerForm" style="display:none;">
            <label class="form-label">Choose Username</label>
            <input id="registerUsername" class="form-control mb-3" required>

            <label class="form-label">Choose Password (minimum 6 characters)</label>
            <input id="registerPassword" type="password" minlength="6" class="form-control mb-3" required>

            <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>

        <div id="authMessage" class="mt-3" role="status"></div>
    </div>
</div>

<!-- STUDY PLANNER -->
<div id="plannerSection" style="display:none;">
    <div class="container py-4">

        <header class="app-header text-center">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                <div class="text-start">
                    <h1>📚 Smart Study Planner</h1>
                    <p class="mb-0">Plan smarter. Learn better. Track your progress.</p>
                </div>
                <button id="logoutBtn" class="btn btn-light">Logout</button>
            </div>
        </header>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="card stat-card">
                    <div>Total Tasks</div>
                    <div class="stat-number" id="total">0</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <div>Completed</div>
                    <div class="stat-number" id="completed">0</div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <div>Progress</div>
                    <div class="stat-number" id="percentage">0%</div>
                </div>
            </div>
        </div>

        <div class="card p-4 mb-4">
            <h4 class="mb-3">➕ Add a Study Task</h4>

            <form id="taskForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label" for="subject">Subject</label>
                        <input id="subject" class="form-control" placeholder="e.g. DBMS" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="topic">Topic</label>
                        <input id="topic" class="form-control" placeholder="e.g. MongoDB" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label" for="date">Study Date</label>
                        <input id="date" type="date" class="form-control" required>
                    </div>
                </div>

                <button class="btn btn-primary w-100 mt-3" type="submit">Add Task</button>
            </form>

            <div id="message" class="mt-3" role="status"></div>
        </div>

        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
                <h4 class="mb-0">📋 My Study Tasks</h4>

                <select id="filter" class="form-select" style="max-width:180px">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div class="progress mb-3">
                <div id="progressBar" class="progress-bar" style="width:0%">0%</div>
            </div>

            <div id="taskList"></div>
        </div>

        <p class="text-center text-secondary mt-4">
            Smart Study Planner | Full Stack Application
        </p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
